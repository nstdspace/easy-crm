apiVersion: apps/v1
kind: Deployment
metadata:
  name: easy-crm
  namespace: default
  labels:
    app: easy-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easy-crm
  template:
    metadata:
      labels:
        app: easy-crm
    spec:
      containers:
        - name: easy-crm
          image: ghcr.io/nstdspace/easy-crm:master
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easycrm-db-secret
                  key: password
          imagePullPolicy: Always
      imagePullSecrets:
        - name: dockerconfig-ghcr-io
